<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Publisher | Bitto29</title>
<style>
:root{color-scheme:dark;--bg:#10100f;--card:#191816;--line:#34312b;--ink:#f4efe6;--muted:#aaa296;--accent:#ff6a42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:20px}h1{font-size:32px;margin:0}p{color:var(--muted)}label{display:block;margin:18px 0 7px;font-weight:600}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#11110f;color:var(--ink);font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:999px;padding:12px 20px;background:var(--ink);color:#111;cursor:pointer;font-weight:700;margin-top:18px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}button:disabled{opacity:.5;cursor:not-allowed}.preview{display:grid;grid-template-columns:260px 1fr;gap:22px}.preview img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:#25231f}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);margin:3px;font-size:12px}.status{margin-top:16px;color:var(--muted)}@media(max-width:650px){.preview{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Project Publisher</h1>
  <p>Paste a live project URL. Generate a draft, review it, then publish it to the projects site.</p>

  <div class="card">
    <label for="url">Project URL</label>
    <input id="url" type="url" placeholder="https://example.com" autocomplete="off">
    <button id="generate">Generate Project</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card" id="preview" hidden>
    <div class="preview">
      <div><img id="shot" alt="Project preview"></div>
      <div>
        <label>Title</label><input id="title">
        <label>Category</label><input id="category">
        <label>Description</label><textarea id="description"></textarea>
        <label>Tags / technology</label><div id="tags"></div>
        <label for="secret">Publish secret</label>
        <input id="secret" type="password" placeholder="Only needed when publishing">
        <button id="publish">Publish to Projects</button>
        <button id="reset" class="secondary">Start Over</button>
      </div>
    </div>
  </div>
</div>
<script>
let draft=null;
const $=id=>document.getElementById(id);
$('generate').onclick=async()=>{
  const url=$('url').value.trim();
  if(!url)return $('status').textContent='Enter a project URL first.';
  $('generate').disabled=true;$('status').textContent='Opening project and generating details...';
  try{
    const r=await fetch('/api/generate-project',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const raw=await r.text();
    let data;
    try{data=JSON.parse(raw)}catch{throw new Error('Server error: '+raw.slice(0,300))}
    if(!r.ok)throw new Error(data.error||'Generation failed.');
    draft=data.project;
    $('title').value=draft.t||'';$('category').value=draft.c||'';$('description').value=draft.d||'';
    $('shot').src=draft.img||'';
    $('tags').innerHTML=[...(draft.tags||[]),...(draft.tech||[])].map(x=>'<span class="pill">'+escapeHtml(x)+'</span>').join('')||'<span class="pill">No tags detected</span>';
    $('preview').hidden=false;$('status').textContent='Draft ready. Review it before publishing.';
  }catch(e){$('status').textContent=e.message}
  finally{$('generate').disabled=false}
};
$('publish').onclick=async()=>{
  if(!draft)return;
  draft.t=$('title').value.trim();draft.c=$('category').value.trim();draft.d=$('description').value.trim();
  $('publish').disabled=true;$('status').textContent='Publishing to GitHub...';
  try{
    const r=await fetch('/api/publish-project',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:draft,secret:$('secret').value})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'Publish failed.');
    $('status').textContent='Published! GitHub/Vercel will update the projects site automatically.';
  }catch(e){$('status').textContent=e.message}
  finally{$('publish').disabled=false}
};
$('reset').onclick=()=>{draft=null;$('preview').hidden=true;$('status').textContent='';$('url').focus()};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
